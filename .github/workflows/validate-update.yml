name: Validate Update

on:
  push:
    paths:
      - "update.json"
      - "packages/**"
      - "checksums/**"
      - ".github/workflows/validate-update.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate update package
        run: |
          python - <<'PY'
          import json
          import hashlib
          from pathlib import Path
          from urllib.parse import urlparse, unquote

          data = json.loads(
              Path("update.json").read_text(encoding="utf-8")
          )

          download_url = data["download_url"]
          expected = data["sha256"].strip().lower()

          filename = unquote(
              Path(urlparse(download_url).path).name
          )

          package = Path("packages") / filename

          if not package.is_file():
              raise SystemExit(
                  f"Package not found: {package}"
              )

          actual = hashlib.sha256(
              package.read_bytes()
          ).hexdigest()

          print("Package:", package)
          print("Expected:", expected)
          print("Actual:  ", actual)

          if actual != expected:
              raise SystemExit("SHA-256 mismatch")

          checksum_file = (
              Path("checksums") /
              f"{filename}.sha256"
          )

          if checksum_file.is_file():
              checksum_value = (
                  checksum_file
                  .read_text(encoding="utf-8")
                  .strip()
                  .split()[0]
                  .lower()
              )

              print("Checksum file:", checksum_file)
              print("Checksum:", checksum_value)

              if checksum_value != actual:
                  raise SystemExit(
                      "Checksum file mismatch"
                  )
          else:
              print(
                  "Checksum file not found; "
                  "update.json SHA-256 validation passed."
              )

          print("Validation passed")
          PY
